name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Character-Build-v1.5.0-ci
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Character-Build-v1.5.0-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Package apksigner tools
        run: |
          TOOLS_DIR=$(dirname "$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)")
          mkdir -p signing-tools/lib
          cp "$TOOLS_DIR/apksigner" signing-tools/
          cp "$TOOLS_DIR/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner

      - name: Upload apksigner tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tools
          path: signing-tools
          if-no-files-found: error
